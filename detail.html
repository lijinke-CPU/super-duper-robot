<script src="script.js"></script>
<script>
var params = new URLSearchParams(location.search);
var id = params.get("id");
var it = DB.find(function (x) { return x.id === id; });
var box = document.getElementById("detail-box");

if (!it) {
  box.innerHTML = '<div class="empty">没有找到这部作品。<br><br><a class="btn" href="recommend.html">去「寻书问影」重新挑选</a></div>';
} else {
  var tagHtml = it.tags.map(function (t, i) { return '<span class="tag c' + ((i % 4) + 1) + '">' + t + '</span>'; }).join("");
  var similar = DB.filter(function (x) { return x.cat === it.cat && x.id !== it.id; }).slice(0, 4);
  var simHtml = similar.map(cardHtml).join("");

  box.innerHTML =
    '<div class="detail-head">' +
      '<div class="detail-cover"><img src="' + coverOf(it) + '" alt="' + it.title + '"></div>' +
      '<div class="detail-info">' +
        '<div class="cat-line">' + CAT_NAME[it.cat] + ' · ' + KIND_NAME[it.kind] + '</div>' +
        '<h1>' + it.title + '</h1>' +
        '<div class="meta">' + it.author + ' ｜ <span class="stars">' + starsHtml(it.rating) + '</span></div>' +
        '<div class="tags">' + tagHtml + '</div>' +
        '<div class="block-title">作品简介</div>' +
        '<p class="desc">' + it.intro + '</p>' +
        '<div class="block-title">值得记住的一句话</div>' +
        '<div class="quote" style="margin-top:0;">' + it.quote + '</div>' +
        '<div class="block-title">书房荐语</div>' +
        '<p class="desc">' + it.reason + '</p>' +
        '<div class="back-line"><a class="btn" href="javascript:history.back()">← 返回上一页</a>　<a class="btn solid" href="recommend.html">继续寻书问影 →</a></div>' +
      '</div>' +
    '</div>' +
    '<h2 class="section-title"><span class="no">荐</span>同类书影 · 也许你也喜欢</h2>' +
    '<div class="grid">' + simHtml + '</div>';

  document.title = it.title + " · 拾光书房";
}
</script>
